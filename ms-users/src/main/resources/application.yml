spring:
  application:
    name: ms-user
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost:3306}/${DB_DATABASE:user_db}?allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:user}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
server:
  port: ${PORT:8001}
logging:
  level:
    org:
      hibernate:
        SQL: debug
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka